<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111824"><title>Critters · Moonfall</title><link rel="stylesheet" href="style.css?v=23"></head><body>
<main id="app"><header><div class="brand" aria-label="Moonfall">🌘 <span>MOONFALL</span></div><div class="resource" aria-label="木材">🪵 <b id="wood">170</b></div><div class="resource" aria-label="稻草"><span>🌾</span><b id="straw">50</b></div><div class="resource" aria-label="砖料"><span>🧱</span><b id="brick">35</b></div><div class="resource" aria-label="星能">✦ <b id="star">50</b></div><div class="resource star-tier blue" aria-label="钻石 Diamonds">💎 <b id="blueStar">0</b></div><div class="resource star-tier gold" aria-label="金星 Gold stars">🌟 <b id="goldStar">0</b></div><div class="base-health" aria-label="基地生命"><span>💚</span><div><i id="healthFill"></i></div></div><div class="head-actions"><button id="sound" aria-label="关闭声音">🔊</button><button id="pause" aria-label="暂停游戏" disabled>⏸</button></div></header>
<section id="world" aria-label="自由建造世界"><canvas id="canvas" aria-label="点角色选择建筑，点土地建造，点树采木；单指拖动，双指旋转和缩放地图"></canvas><div id="toast" role="status"></div><div class="wave-panel"><span id="moonProgress" aria-label="月亮碎片">🌙 0/6</span><span id="heatBadge" aria-label="本局 Heat">🔥0</span><span id="levelBadge" aria-label="关卡">🌙 1</span><span>🧟 <b id="wave">0 / 6</b></span><span id="countdown">⏳ 30</span><button id="finishSession" aria-label="结束自由创造并庆祝" hidden>🏁</button><button id="nextWave" aria-label="开始下一波">⏩</button></div><div class="zoom-panel"><button id="rotateLeft" aria-label="向左旋转地图">↶</button><button id="rotateRight" aria-label="向右旋转地图">↷</button><button id="zoomIn" aria-label="放大地图">＋</button><button id="zoomOut" aria-label="缩小地图">−</button><button id="center" aria-label="回到基地">⌖</button></div><div class="powers"><button id="sun" aria-label="阳光冲击，攻击基地附近敌人">☀️<small id="sunTime"></small></button><button id="moon" aria-label="守护碎片，为基地恢复生命"><span id="moonIcon">🌑</span><small id="moonPrice">✦40</small></button></div><div id="selection" hidden><span id="selectionIcon"></span><span id="selectionLevel"></span><button id="repair" aria-label="修复百分之十五生命，消耗木材十、稻草四、砖三；受攻击后等三秒">🔧<small>🪵10 🌾4 🧱3</small></button><button id="sell" aria-label="拆除并返还一半木材">♻️</button><button id="closeSelection" aria-label="关闭建筑操作">✕</button></div></section>
<footer><div id="buildBar" role="group" aria-label="Critter 建造单位"></div><button id="upgradeTool" class="build-card" aria-label="升级 Upgrade，先点此按钮，再点建筑" aria-pressed="false"><span class="upgrade-tool-icon">⬆️</span><b>升级 Upgrade</b><span id="upgradeToolCost" class="cost"></span></button><div id="buildTotal" aria-label="当前建筑数量"></div><button id="cancelBuild" aria-label="取消建造，切换查看模式">👆</button></footer>
<div id="menu" class="overlay"><div class="menu-card"><div class="moon-art">🌘</div><div class="menu-portraits"><img src="assets/critters/critter_04_catnap.webp" alt="CatNap"><span>🚀</span><img src="assets/critters/critter_05_dogday.webp" alt="DogDay"></div><h1>MOONFALL</h1><div class="menu-modes" role="group" aria-label="玩法"><button id="survival" aria-label="月夜生存" aria-pressed="true" class="selected">🌙 🛡️<small>生存 · Survival</small></button><button id="creative" aria-label="自由创造，无限资源" aria-pressed="false">🧱 ∞<small>创造 · Creative</small></button></div><div class="heat-control"><label for="heat">🔥 Heat <b id="heatValue">0</b> / 10</label><input id="heat" type="range" min="0" max="10" step="1" value="0" aria-label="难度 Heat 0 到 10"><div class="heat-ends"><span>轻松 Easy</span><span>挑战 Hard</span></div><small id="heatScale"></small></div><canvas id="mapPreview" width="220" height="108" aria-label="地图预览"></canvas><div class="level-picker" id="levelPicker"><button id="levelDown" aria-label="上一关">◀</button><b id="levelChoice">🌙 1</b><button id="levelUp" aria-label="下一已解锁关卡">▶</button></div><div class="menu-buttons"><button id="menuPalace" aria-label="广寒宫 Moon Palace">🏯<small>广寒宫<br>Moon Palace</small></button><button id="start" class="primary menu-game-option" aria-label="新游戏 New Game"><span class="menu-option-icon" aria-hidden="true">🌱＋</span><b>新游戏</b><em>New Game</em><small aria-hidden="true">🌘 🚀</small></button><button id="resumeSave" class="menu-game-option" aria-label="读取存档 Load Game" disabled><span class="menu-option-icon" aria-hidden="true">💾 ▶</span><b>读取存档</b><em>Load Game</em><small id="savePreview" aria-hidden="true">—</small></button></div><div class="picture-guide" aria-hidden="true">👆 🐻 → 🧱　 🪵 → 🏰</div><div id="resultStats" hidden></div></div></div>
<div id="ending" class="overlay" role="dialog" aria-modal="true" aria-label="游戏结算" hidden><canvas id="confetti" aria-hidden="true"></canvas><div class="ending-card"><canvas id="storyScene" width="640" height="300" aria-label="收集六块碎片重建月亮，伙伴们围坐篝火"></canvas><div id="endingMoon">🌕</div><div id="endingTrophy">🏆</div><div id="party" aria-hidden="true"></div><div id="endingStats"></div><div id="scorePanel"></div><div class="ending-actions"><button id="openPalace" aria-label="广寒宫商店">🏯</button><button id="harder" class="primary" aria-label="挑战下一更难关卡">🔥 2 ➜</button><button id="retry" aria-label="重玩本关">↻</button><button id="endingHome" aria-label="返回首页">🏠</button></div></div></div>
<div id="pauseOverlay" class="overlay" hidden><div class="pause-card"><span>⏸</span><button id="resume" class="primary" aria-label="继续游戏">▶</button><button id="restart" aria-label="返回首页">🏠</button></div></div>
<div id="cinema" hidden><canvas id="intro"></canvas><button id="skipIntro" aria-label="跳过开场">⏭</button><div id="introProgress"><i></i></div></div>
<div id="palace" class="overlay" role="dialog" aria-modal="true" aria-label="广寒宫" hidden><div class="palace-scenery" aria-hidden="true"><img class="palace-hall" src="assets/palace/guanghan-toy.svg" alt=""><div class="roof-rabbit"><svg viewBox="0 0 100 90"><ellipse cx="50" cy="72" rx="26" ry="7" fill="#203e5440"/><g fill="#fff5e3" stroke="#adc7d0" stroke-width="2"><ellipse cx="47" cy="51" rx="24" ry="19"/><circle cx="68" cy="40" r="18"/><ellipse cx="62" cy="17" rx="6" ry="19" transform="rotate(-12 62 17)"/><ellipse cx="77" cy="15" rx="6" ry="20" transform="rotate(14 77 15)"/><circle cx="22" cy="44" r="9"/><ellipse cx="36" cy="69" rx="12" ry="5"/><ellipse cx="66" cy="65" rx="10" ry="5"/></g><path d="M62 7v17M77 4v21" stroke="#edbac6" stroke-width="3" stroke-linecap="round"/><circle cx="75" cy="37" r="3" fill="#39495d"/><circle cx="82" cy="46" r="4" fill="#f0bdbe"/></svg></div><div class="palace-mist mist-back"></div><div class="palace-mist mist-front"></div><div class="palace-sparks"></div></div><div class="palace-card"><h2 class="sr-only">广寒宫</h2><b id="moonWallet">🌙 0</b><div id="shopItems"></div><div class="ending-actions"><button id="shopClose" aria-label="离开广寒宫">↩</button><button id="shopGo" class="primary" aria-label="带上强化进入下一关">▶</button></div></div></div><audio id="music" playsinline preload="none"></audio></main><script type="module" src="app.mjs?v=23"></script></body></html>
