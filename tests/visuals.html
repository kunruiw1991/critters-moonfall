<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonfall model review</title><style>body{margin:0;background:#1a2b3c;color:#ecdfba;font:18px system-ui}canvas{display:block;width:100%;height:auto}h1{font-size:20px;text-align:center}nav{display:flex;justify-content:center;gap:20px}button{padding:12px 30px;font-size:20px;background:#d9dab7;border:0;border-radius:12px}</style><h1>Moonfall · 模型与地图检查</h1><canvas id="models" width="1360" height="250"></canvas><nav><button id="ice">❄️ 3</button><button id="sand">🌀 4</button></nav><canvas id="map" width="1360" height="760"></canvas><script type="module">
import {heightZombie,render} from '../render.mjs?v=11';import {createGame,ENEMIES,makeEnemy} from '../engine.mjs?v=11';
const c=document.querySelector('#models').getContext('2d'),types=['zombie','runner','brute','spitter','bomber','healer','summoner','mini'];let level=3,g=createGame({level,creative:true});
function reset(n){level=n;g=createGame({level,creative:true});g.wave=2;g.enemies=types.slice(0,7).map((k,i)=>makeEnemy(g,k,4+i*2,6));}document.querySelector('#ice').onclick=()=>reset(3);document.querySelector('#sand').onclick=()=>reset(4);reset(3);
function frame(t){c.clearRect(0,0,1360,250);types.forEach((k,i)=>{const e=ENEMIES[k];c.save();c.translate(90+i*167,185);c.scale(e.size*1.65,e.size*1.65);heightZombie(c,0,0,t/1000,i,e.color,.3,k);c.restore()});render(document.querySelector('#map').getContext('2d'),1360,760,g,{rotation:0,zoom:1,panX:0,panY:0},{},null,null,null,t/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
